ver = "0.4.1"

##### COMPILATION TESTS #####

[[tests]]
name = "parsing"
paths = ["tests/bonsai/lower/*.bonsai"]
cmd = """
./build/compiler {}
"""

[[tests]]
name = "errors"
paths = ["tests/bonsai/error/*.bonsai"]
cmd = """
./build/compiler {}
"""

[[tests]]
name = "backends"
paths = ["tests/bonsai/backends/**/*.bonsai"]
# Retrieves the flags passed on the first line of the test file.
cmd = """
flags="$(head -n 1 {} | cut -c 3-)"
./build/compiler {} $flags
"""